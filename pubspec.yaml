name: hatcher
description: Egg incubator rotation reminder app for 4 phones.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0

  # Utils
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/sounds/alarm_sound.ogg

  fonts:
    - family: NotoSansMalayalam
      fonts:
        - asset: fonts/NotoSansMalayalam/NotoSansMalayalam-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansMalayalam/NotoSansMalayalam-Bold.ttf
          weight: 700
